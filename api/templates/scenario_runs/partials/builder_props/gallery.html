<div class="props-form" data-props-type="gallery">
  <div class="gallery-items" data-gallery-items></div>
  <div class="props-inline">
    <button type="button" class="gallery-add-item">Adicionar item</button>
  </div>
  <label class="props-field">
    <span>Transição</span>
    <select data-prop="transition">
      <option value="fade">Fade</option>
      <option value="none">Sem transição</option>
    </select>
  </label>
  <label class="props-field checkbox">
    <input type="checkbox" data-prop="show_controls" />
    Mostrar botões na galeria
  </label>
</div>
