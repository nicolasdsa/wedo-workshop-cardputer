<div class="props-form" data-props-type="button">
  <label class="props-field">
    <span>Label</span>
    <input type="text" data-prop="label" placeholder="Texto do botão" />
  </label>
  <label class="props-field">
    <span>Ação</span>
    <select data-prop="action.type">
      <option value="next">Próximo</option>
      <option value="goto">Ir para tela</option>
      <option value="toggle_gif">Alternar GIF</option>
    </select>
  </label>
  <label class="props-field conditional conditional-goto">
    <span>Índice da tela</span>
    <input type="number" min="0" data-prop="action.target_index" placeholder="0, 1, 2..." />
  </label>
  <label class="props-field conditional conditional-toggle">
    <span>GIF alvo</span>
    <select data-prop="action.target_component_key" data-gif-options>
      <option value="">Selecione um GIF</option>
    </select>
  </label>
</div>
