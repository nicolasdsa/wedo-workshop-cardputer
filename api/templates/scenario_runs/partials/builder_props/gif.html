<div class="props-form" data-props-type="gif">
  <label class="props-field">
    <span>GIF</span>
    <div class="props-upload">
      <input type="file" accept="image/gif,image/*" data-upload="src" />
      <button type="button" class="upload-trigger">Escolher arquivo</button>
      <span class="upload-filename" data-upload-label></span>
    </div>
  </label>
  <label class="props-field">
    <span>Alt text</span>
    <input type="text" data-prop="alt" placeholder="Descrição do GIF" />
  </label>
  <label class="props-field checkbox">
    <input type="checkbox" data-prop="show_controls" />
    Mostrar controles (play/pause)
  </label>
</div>
