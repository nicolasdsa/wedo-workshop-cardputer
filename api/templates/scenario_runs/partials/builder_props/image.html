<div class="props-form" data-props-type="image">
  <label class="props-field">
    <span>Imagem</span>
    <div class="props-upload">
      <input type="file" accept="image/*" data-upload="src" />
      <button type="button" class="upload-trigger">Escolher arquivo</button>
      <span class="upload-filename" data-upload-label></span>
    </div>
  </label>
  <label class="props-field">
    <span>Alt text</span>
    <input type="text" data-prop="alt" placeholder="Descrição da imagem" />
  </label>
  <label class="props-field">
    <span>Ajuste</span>
    <select data-prop="fit">
      <option value="contain">Contain</option>
      <option value="cover">Cover</option>
    </select>
  </label>
</div>
