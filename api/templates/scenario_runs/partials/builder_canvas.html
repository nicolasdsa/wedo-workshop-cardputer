<div class="builder-canvas canvas-screen"
     data-screen-id="{{ screen.id }}"
     data-scenario-id="{{ screen.scenario_id }}"
     data-screen-index="{{ index }}"
     data-order-index="{{ screen.order_index }}"
     data-animation-key="{{ screen.animation_key or '' }}">
  {% if screen.components %}
    {% for component in screen.components %}
      {% with builder_mode=True %}
        {% include "scenario_runs/partials/components/component.html" %}
      {% endwith %}
    {% endfor %}
  {% else %}
    <div class="canvas-empty">Arraste um componente para começar.</div>
  {% endif %}
  <div id="guide-v" class="align-guide v hidden"></div>
  <div id="guide-h" class="align-guide h hidden"></div>
</div>
